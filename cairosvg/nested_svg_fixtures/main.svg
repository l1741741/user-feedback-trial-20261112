<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g">
      <stop offset="0" stop-color="#0000ff"/>
    </linearGradient>
    <clipPath id="c"><rect x="0" y="0" width="100" height="100"/></clipPath>
  </defs>
  <image x="5" y="5" width="40" height="40" href="icon1.svg"/>
  <image x="55" y="5" width="40" height="40" href="icon2.svg"/>
  <!-- id "g" and "c" collide with the embedded icons: main-doc
       references must resolve to the main document's own definitions -->
  <rect x="5" y="50" width="90" height="45" fill="url(#g)"
        clip-path="url(#c)"/>
</svg>
