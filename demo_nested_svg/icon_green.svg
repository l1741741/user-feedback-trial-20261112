<?xml version="1.0"?>
<!-- Green icon: same ids "paint"/"frame" as the other documents. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"
     viewBox="0 0 64 64">
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22ff22"/>
      <stop offset="1" stop-color="#006600"/>
    </linearGradient>
    <clipPath id="frame">
      <circle cx="32" cy="32" r="26"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="64" height="64" fill="url(#paint)"
        clip-path="url(#frame)"/>
</svg>
