<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <!-- objectBoundingBox: same mask reused by objects of different
         size and position; each must get its own centered 50% region -->
    <mask id="m" maskContentUnits="objectBoundingBox">
      <rect x="0.25" y="0.25" width="0.5" height="0.5" fill="white"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="200" height="200" fill="red" mask="url(#m)"/>
  <rect x="220" y="50" width="160" height="100" fill="blue" mask="url(#m)"/>
</svg>
