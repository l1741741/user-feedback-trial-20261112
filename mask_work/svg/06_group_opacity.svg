<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="100">
      <rect x="0" y="0" width="200" height="100" fill="white" opacity="0.5"/>
    </mask>
  </defs>
  <!-- group opacity 0.5 combined with mask alpha 0.5: final alpha must be 0.25 -->
  <g opacity="0.5" mask="url(#m)">
    <rect x="0" y="0" width="200" height="100" fill="red"/>
  </g>
</svg>
