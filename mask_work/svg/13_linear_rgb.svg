<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="100"
          color-interpolation="linearRGB">
      <rect x="0" y="0" width="100" height="100" fill="rgb(128,128,128)"/>
      <rect x="100" y="0" width="100" height="100" fill="rgb(128,128,128)"
            color-interpolation="sRGB"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="200" height="100" fill="red" mask="url(#m)"/>
</svg>
