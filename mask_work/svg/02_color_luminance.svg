<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100" viewBox="0 0 300 100">
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="100">
      <rect x="0"   y="0" width="100" height="100" fill="red"/>
      <rect x="100" y="0" width="100" height="100" fill="lime"/>
      <rect x="200" y="0" width="100" height="100" fill="blue"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="300" height="100" fill="white" mask="url(#m)"/>
</svg>
