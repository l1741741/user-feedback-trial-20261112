<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100" viewBox="0 0 300 100">
  <defs>
    <!-- alpha mask: colors are ignored, only alpha matters -->
    <mask id="a" mask-type="alpha" maskUnits="userSpaceOnUse"
          x="0" y="0" width="300" height="100">
      <rect x="0"   y="0" width="150" height="100" fill="black" opacity="1"/>
      <rect x="150" y="0" width="150" height="100" fill="white" opacity="0.5"/>
    </mask>
    <!-- luminance mask with the same geometry but different colors -->
    <mask id="l" mask-type="luminance" maskUnits="userSpaceOnUse"
          x="0" y="0" width="300" height="100">
      <rect x="0"   y="0" width="150" height="100" fill="black" opacity="1"/>
      <rect x="150" y="0" width="150" height="100" fill="white" opacity="0.5"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="300" height="50" fill="red" mask="url(#a)"/>
  <rect x="0" y="50" width="300" height="50" fill="red" mask="url(#l)"/>
</svg>
