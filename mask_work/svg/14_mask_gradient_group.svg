<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="black"/>
      <stop offset="0.5" stop-color="rgb(128,128,128)"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="gm" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="120">
      <rect x="0" y="0" width="240" height="120" fill="url(#fade)"/>
      <!-- a semi-transparent group inside the mask: alpha multiplies luma -->
      <g opacity="0.5">
        <rect x="120" y="0" width="120" height="120" fill="white"/>
      </g>
    </mask>
  </defs>
  <rect x="0" y="0" width="240" height="120" fill="green" mask="url(#gm)"/>
</svg>
