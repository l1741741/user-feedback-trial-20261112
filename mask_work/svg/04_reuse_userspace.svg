<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="200">
      <circle cx="120" cy="100" r="60" fill="white"/>
      <rect x="250" y="40" width="100" height="120" fill="white"/>
    </mask>
  </defs>
  <!-- large object at origin -->
  <rect x="0" y="0" width="400" height="200" fill="red" mask="url(#m)"/>
  <!-- small object reusing the same mask, shifted and scaled via transform -->
  <rect x="0" y="0" width="80" height="80" fill="blue"
        transform="translate(200,60) scale(0.5)" mask="url(#m)"/>
</svg>
