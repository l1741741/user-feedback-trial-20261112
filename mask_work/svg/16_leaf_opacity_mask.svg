<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="100">
      <rect x="0" y="0" width="200" height="100" fill="white" opacity="0.5"/>
    </mask>
  </defs>
  <!-- leaf element with its own opacity AND a mask alpha: result 0.5*0.5 -->
  <rect x="0" y="0" width="100" height="100" fill="red"
        opacity="0.5" mask="url(#m)"/>
  <!-- control: mask only -->
  <rect x="100" y="0" width="100" height="100" fill="red" mask="url(#m)"/>
</svg>
