<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">
  <!--
    The embedded icon is mapped inside a transformed group: its own
    coordinate system must still be resolved independently, and the outer
    transform must position and scale the mapped result.
  -->
  <rect width="160" height="160" fill="#ffffff"/>
  <g transform="translate(80 80) rotate(90) scale(1.5)">
    <image href="icons/green.svg" x="-20" y="-20" width="40" height="40"/>
  </g>
  <!-- Sibling using the outer definitions, to check nothing leaked. -->
  <rect x="0" y="140" width="160" height="20" fill="#0000ff"/>
</svg>
