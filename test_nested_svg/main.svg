<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300">
  <!--
    Offline nested-SVG case: two icons embedded with the same ids
    (a `gradient` and a `clip`) but different colors, plus an icon with a
    relative image resource. Everything below is drawn with the outer
    document's own definitions, after the images.
  -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#ffff00"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="110" y="190" width="40" height="40"/>
    </clipPath>
  </defs>

  <!-- Outer background using the outer `gradient`, red to yellow. -->
  <rect width="200" height="300" fill="url(#gradient)"/>

  <!-- Two embedded icons sharing the same ids, different colors. -->
  <image href="icons/green.svg" x="10" y="10" width="80" height="80"/>
  <image href="icons/blue.svg" x="110" y="10" width="80" height="80"/>

  <!-- Same icon embedded twice, at two different sizes. -->
  <image href="icons/green.svg" x="10" y="100" width="40" height="40"/>
  <image href="icons/green.svg" x="60" y="100" width="80" height="80"/>

  <!-- An icon whose own relative resource must be resolved in icons/sub/. -->
  <image href="icons/sub/relative.svg" x="10" y="190" width="80" height="40"/>

  <!--
    Outer shapes drawn after the embedded images. They use the outer
    `clip` and `gradient`: neither id must have been redefined by an icon.
  -->
  <rect x="110" y="190" width="80" height="40" fill="#00ffff"
        clip-path="url(#clip)"/>
  <rect x="10" y="250" width="80" height="40" fill="url(#gradient)"/>
</svg>
