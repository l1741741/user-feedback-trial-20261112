<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!--
    The background is white, the two icons are painted on a transparent
    background. The areas of each image region that the icon does not paint
    must stay transparent instead of becoming opaque black, so the white
    background has to remain visible there.
  -->
  <rect width="200" height="200" fill="#ffffff"/>
  <image href="icons/green.svg" x="0" y="0" width="100" height="100"/>
  <image href="icons/blue.svg" x="100" y="0" width="100" height="100"/>
</svg>
