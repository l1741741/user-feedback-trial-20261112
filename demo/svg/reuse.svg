<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180">
  <!-- One mask (left half visible, right half hidden, in bounding-box
       fractions) reused by objects of different sizes and positions.
       Each object must be masked relative to its own bounding box. -->
  <defs>
    <mask id="half" maskContentUnits="objectBoundingBox">
      <rect x="0" y="0" width="0.5" height="1" fill="white"/>
    </mask>
  </defs>
  <rect width="240" height="180" fill="rgb(230,230,230)"/>
  <rect x="10" y="10" width="60" height="40" fill="rgb(30,140,60)" mask="url(#half)"/>
  <rect x="90" y="20" width="140" height="30" fill="rgb(30,140,60)" mask="url(#half)"/>
  <ellipse cx="70" cy="120" rx="50" ry="35" fill="rgb(30,140,60)" mask="url(#half)"/>
  <rect x="150" y="90" width="70" height="70" fill="rgb(30,140,60)" mask="url(#half)"/>
</svg>
