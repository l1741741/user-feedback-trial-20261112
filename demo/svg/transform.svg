<svg xmlns="http://www.w3.org/2000/svg" width="220" height="160">
  <!-- userSpaceOnUse mask + transformed masked elements: the mask lives
       in each element's user space and follows its transforms. -->
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="-150" y="-150" width="300" height="300">
      <rect x="0" y="-150" width="150" height="300" fill="white"/>
    </mask>
  </defs>
  <rect width="220" height="160" fill="rgb(230,230,230)"/>
  <g transform="translate(60, 50)">
    <rect x="-40" y="-25" width="80" height="50" fill="rgb(200,30,30)" mask="url(#m)"/>
  </g>
  <g transform="translate(150, 100) rotate(30)">
    <rect x="-40" y="-25" width="80" height="50" fill="rgb(200,30,30)" mask="url(#m)"/>
  </g>
</svg>
