<?xml version="1.0" encoding="UTF-8"?>
<!--
  Colour-flags demo layout (480x320, four times the required 240x160).

  The same file is exported twice by ``demo.py``:
  * normal preview (both options off),
  * inverted preview (``negate_colors`` and/or ``invert_images``).

  Every tile is labelled, so the actual PNG can be checked visually:
  the labels are vectors (affected by ``negate_colors`` only) while the
  photographs are rasters (affected by ``invert_images`` only).

  Image references are local files in ``assets/``; pass ``unsafe=True``
  or a ``url_fetcher`` when converting.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="480" height="320" viewBox="0 0 480 320">
  <defs>
    <pattern id="vector-checker" width="32" height="32"
             patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#ff8000"/>
      <rect x="16" y="16" width="16" height="16" fill="#3366cc"/>
      <image x="16" y="0" width="16" height="16"
             xlink:href="assets/tile_transparent.png"/>
    </pattern>
    <linearGradient id="vector-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="0.5" stop-color="#00c000" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient>
  </defs>

  <!-- Background and vector swatches -->
  <rect width="480" height="320" fill="#101820"/>
  <rect x="8" y="8" width="150" height="80" fill="#ff8000"/>
  <rect x="166" y="8" width="150" height="80" fill="url(#vector-gradient)"/>
  <rect x="324" y="8" width="148" height="80" fill="url(#vector-checker)"/>
  <rect x="8" y="96" width="464" height="18" fill="url(#vector-checker)"/>

  <!-- RGBA with opaque, semi-transparent and fully transparent quadrants -->
  <image x="8" y="124" width="96" height="96"
         xlink:href="assets/rgba_quadrants.png"/>
  <!-- Palette image whose right half is a transparent palette index -->
  <image x="112" y="124" width="96" height="96"
         xlink:href="assets/palette_transparent.png"/>
  <!-- RGB PNG using a tRNS colour key -->
  <image x="216" y="124" width="96" height="96"
         xlink:href="assets/rgb_colour_key.png"/>

  <!-- EXIF orientation 6: stored 48x24, displayed 24x48 -->
  <image x="320" y="124" width="48" height="96"
         xlink:href="assets/oriented.jpg"/>
  <image x="372" y="124" width="48" height="96"
         xlink:href="assets/oriented.png"/>

  <!-- Reuse of a single image: clipped, scaled and tiled -->
  <defs>
    <clipPath id="round-clip" clipPathUnits="userSpaceOnUse">
      <circle cx="56" cy="276" r="40"/>
    </clipPath>
    <pattern id="raster-tile" width="24" height="24"
             patternUnits="userSpaceOnUse">
      <image x="0" y="0" width="24" height="24"
             xlink:href="assets/rgba_quadrants.png"/>
    </pattern>
  </defs>
  <image x="8" y="228" width="96" height="96" clip-path="url(#round-clip)"
         xlink:href="assets/rgb_blue.png"/>
  <rect x="112" y="228" width="96" height="96" fill="url(#raster-tile)"/>
  <rect x="216" y="228" width="96" height="60" fill="#202a32"/>
  <image x="216" y="228" width="96" height="60"
         xlink:href="assets/cmyk_blocks.tif"/>
  <image x="216" y="292" width="96" height="32"
         xlink:href="assets/gray16.png" preserveAspectRatio="none"/>

  <!-- Text is vector: it follows negate_colors, never invert_images -->
  <g font-family="DejaVu Sans, sans-serif" font-size="11" fill="#ffffff">
    <text x="8" y="222">vector fill / gradient / pattern</text>
    <text x="424" y="124">EXIF</text>
    <text x="424" y="138">jpg</text>
    <text x="8" y="316">rgba · palette · rgb-key · clip · tile · cmyk · 16-bit</text>
  </g>
</svg>
